<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive PCA Scatterplot</title>
<style>
  :root {
    --ink: #18212b;
    --muted: #637083;
    --grid: #dde3ea;
    --panel: #ffffff;
    --page: #f3f6f9;
    --pc1: #6554c0;
    --pc2: #d58a00;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 22px;
    background: var(--page);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  .app {
    width: min(1100px, 100%);
    margin: auto;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0 0 5px;
    font-size: clamp(1.35rem, 3vw, 2rem);
    letter-spacing: -0.025em;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.94rem;
  }

  button {
    border: 1px solid #c8d0da;
    border-radius: 9px;
    padding: 9px 15px;
    background: white;
    color: var(--ink);
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 1px 2px #1a26331a;
  }

  button:hover { background: #f7f8fa; }
  button:focus-visible { outline: 3px solid #7aa7ff88; outline-offset: 2px; }

  .card {
    overflow: hidden;
    border: 1px solid #d8dee6;
    border-radius: 15px;
    background: var(--panel);
    box-shadow: 0 8px 28px #21304412;
  }

  .plot-wrap {
    position: relative;
    padding: 10px 12px 2px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    min-height: 430px;
    touch-action: none;
    user-select: none;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1;
  }

  .axis-line {
    stroke: #738092;
    stroke-width: 1.4;
  }

  .tick-label {
    fill: #697587;
    font-size: 12px;
  }

  .axis-label {
    fill: #273444;
    font-size: 15px;
    font-weight: 700;
  }

  .point {
    stroke: white;
    stroke-width: 1.25;
    cursor: grab;
    transition: r 100ms ease, filter 100ms ease;
  }

  .point:hover {
    r: 6.2;
    filter: drop-shadow(0 2px 2px #0004);
  }

  .point:active { cursor: grabbing; }

  .centroid {
    cursor: grab;
    stroke-width: 2.2;
    filter: drop-shadow(0 1px 1px #fff);
  }

  .centroid:active { cursor: grabbing; }

  .centroid-cross {
    pointer-events: none;
    stroke-width: 2.4;
    stroke-linecap: round;
  }

  .pca {
    pointer-events: none;
  }

  .pc-line {
    stroke-width: 3;
    stroke-linecap: round;
  }

  .pc-label {
    font-size: 13px;
    font-weight: 800;
    paint-order: stroke;
    stroke: white;
    stroke-width: 4px;
    stroke-linejoin: round;
  }

  .all-centroid {
    pointer-events: none;
    fill: white;
    stroke: #374151;
    stroke-width: 2;
  }

  .status {
    display: grid;
    grid-template-columns: repeat(4, minmax(130px, 1fr));
    border-top: 1px solid #e0e5eb;
    background: #fbfcfd;
  }

  .stat {
    padding: 13px 16px;
    border-right: 1px solid #e0e5eb;
  }

  .stat:last-child { border-right: 0; }

  .stat-name {
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 750;
    letter-spacing: 0.055em;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 1rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
    padding: 13px 17px;
    border-top: 1px solid #e0e5eb;
    color: #485568;
    font-size: 0.83rem;
  }

  .key {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: black;
    box-shadow: inset 0 0 0 1px #0002;
  }

  .dot.red { background: #d82828; }

  .line-key {
    width: 25px;
    height: 0;
    border-top: 3px solid var(--pc1);
  }

  .line-key.pc2 {
    border-color: var(--pc2);
    border-top-style: dashed;
  }

  .hint {
    margin-left: auto;
    color: #536174;
    font-weight: 600;
  }

  @media (max-width: 700px) {
    body { padding: 10px; }
    header { align-items: stretch; }
    .status { grid-template-columns: 1fr 1fr; }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid #e0e5eb; }
    .hint { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Interactive PCA Scatterplot</h1>
      <p class="subtitle">Drag either data group and watch the principal components update.</p>
    </div>
    <button id="reset" type="button">Reset groups</button>
  </header>

  <section class="card">
    <div class="plot-wrap">
      <svg id="plot" viewBox="0 0 960 590" role="img"
           aria-label="Scatterplot with draggable black and red groups, their centroids, and two principal component axes">
        <defs>
          <marker id="arrow-pc1" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6554c0"></path>
          </marker>
          <marker id="arrow-pc2" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d58a00"></path>
          </marker>
          <clipPath id="plot-clip">
            <rect x="76" y="24" width="856" height="500"></rect>
          </clipPath>
        </defs>

        <g id="grid"></g>
        <g id="axes"></g>

        <g clip-path="url(#plot-clip)">
          <g id="pcaLayer" class="pca"></g>
          <g id="pointsLayer"></g>
          <g id="centroidsLayer"></g>
        </g>

        <g id="pcaLabels" class="pca"></g>
      </svg>
    </div>

    <div class="status">
      <div class="stat">
        <div class="stat-name">Black centroid</div>
        <div class="stat-value" id="centroid0">—</div>
      </div>
      <div class="stat">
        <div class="stat-name">Red centroid</div>
        <div class="stat-value" id="centroid1">—</div>
      </div>
      <div class="stat">
        <div class="stat-name">Within-group r</div>
        <div class="stat-value" id="correlations">—</div>
      </div>
      <div class="stat">
        <div class="stat-name">PC1 variance</div>
        <div class="stat-value" id="variance">—</div>
      </div>
    </div>

    <div class="legend">
      <span class="key"><span class="dot"></span>Group 1</span>
      <span class="key"><span class="dot red"></span>Group 2</span>
      <span class="key"><span class="line-key"></span>PC1</span>
      <span class="key"><span class="line-key pc2"></span>PC2</span>
      <span class="hint">Drag any dot or centroid to move its entire group.</span>
    </div>
  </section>
</main>

<script>
(() => {
  const svg = document.getElementById("plot");
  const NS = "http://www.w3.org/2000/svg";
  const bounds = { left: 76, top: 24, width: 856, height: 500 };
  const domain = { xMin: 0, xMax: 100, yMin: 0, yMax: 100 };
  const colors = ["#111111", "#d82828"];
  const initialCenters = [{ x: 31, y: 34 }, { x: 69, y: 66 }];

  let groups = [];
  let drag = null;

  const sx = x => bounds.left + (x - domain.xMin) /
    (domain.xMax - domain.xMin) * bounds.width;
  const sy = y => bounds.top + bounds.height -
    (y - domain.yMin) / (domain.yMax - domain.yMin) * bounds.height;
  const ix = px => domain.xMin + (px - bounds.left) / bounds.width *
    (domain.xMax - domain.xMin);
  const iy = py => domain.yMin + (bounds.top + bounds.height - py) /
    bounds.height * (domain.yMax - domain.yMin);

  function el(name, attrs = {}, parent) {
    const node = document.createElementNS(NS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  }

  function mean(values) {
    return values.reduce((a, b) => a + b, 0) / values.length;
  }

  function makeExactlyCorrelatedPoints(center, phase) {
    const n = 24;
    let u = Array.from({ length: n }, (_, i) => i - (n - 1) / 2);
    let v = Array.from({ length: n }, (_, i) =>
      Math.sin((i + 1) * 2.17 + phase) + 0.45 * Math.cos((i + 1) * 0.91 + phase)
    );

    const centerVector = a => {
      const m = mean(a);
      return a.map(x => x - m);
    };

    u = centerVector(u);
    v = centerVector(v);

    const projection = u.reduce((s, x, i) => s + x * v[i], 0) /
      u.reduce((s, x) => s + x * x, 0);
    v = v.map((x, i) => x - projection * u[i]);

    const normU = Math.sqrt(mean(u.map(x => x * x)));
    const normV = Math.sqrt(mean(v.map(x => x * x)));
    u = u.map(x => x / normU);
    v = v.map(x => x / normV);

    return u.map((x, i) => ({
      x: center.x + 8.5 * x,
      y: center.y + 8.5 * (0.8 * x + 0.6 * v[i])
    }));
  }

  function initialize() {
    groups = [
      makeExactlyCorrelatedPoints(initialCenters[0], 0.25),
      makeExactlyCorrelatedPoints(initialCenters[1], 1.4)
    ];
    render();
  }

  function centroid(points) {
    return {
      x: mean(points.map(p => p.x)),
      y: mean(points.map(p => p.y))
    };
  }

  function correlation(points) {
    const c = centroid(points);
    let xx = 0, yy = 0, xy = 0;
    for (const p of points) {
      const dx = p.x - c.x;
      const dy = p.y - c.y;
      xx += dx * dx;
      yy += dy * dy;
      xy += dx * dy;
    }
    return xy / Math.sqrt(xx * yy);
  }

  function calculatePCA(points) {
    const c = centroid(points);
    let a = 0, b = 0, d = 0;

    for (const p of points) {
      const dx = p.x - c.x;
      const dy = p.y - c.y;
      a += dx * dx;
      b += dx * dy;
      d += dy * dy;
    }

    a /= points.length;
    b /= points.length;
    d /= points.length;

    const trace = a + d;
    const root = Math.sqrt((a - d) ** 2 + 4 * b * b);
    const l1 = (trace + root) / 2;
    const l2 = (trace - root) / 2;

    let v1;
    if (Math.abs(b) > 1e-10) {
      v1 = { x: l1 - d, y: b };
    } else {
      v1 = a >= d ? { x: 1, y: 0 } : { x: 0, y: 1 };
    }

    const length = Math.hypot(v1.x, v1.y);
    v1.x /= length;
    v1.y /= length;

    if (v1.x < 0) {
      v1.x *= -1;
      v1.y *= -1;
    }

    return {
      center: c,
      vectors: [v1, { x: -v1.y, y: v1.x }],
      values: [l1, l2],
      explained: trace ? l1 / trace : 0
    };
  }

  function buildScaffold() {
    const grid = document.getElementById("grid");
    const axes = document.getElementById("axes");

    for (let t = 0; t <= 100; t += 10) {
      el("line", {
        x1: sx(t), y1: bounds.top, x2: sx(t), y2: bounds.top + bounds.height,
        class: "grid-line"
      }, grid);
      el("line", {
        x1: bounds.left, y1: sy(t), x2: bounds.left + bounds.width, y2: sy(t),
        class: "grid-line"
      }, grid);

      if (t % 20 === 0) {
        const tx = el("text", {
          x: sx(t), y: bounds.top + bounds.height + 22,
          "text-anchor": "middle", class: "tick-label"
        }, axes);
        tx.textContent = t;

        const ty = el("text", {
          x: bounds.left - 12, y: sy(t) + 4,
          "text-anchor": "end", class: "tick-label"
        }, axes);
        ty.textContent = t;
      }
    }

    el("line", {
      x1: bounds.left, y1: bounds.top + bounds.height,
      x2: bounds.left + bounds.width, y2: bounds.top + bounds.height,
      class: "axis-line"
    }, axes);

    el("line", {
      x1: bounds.left, y1: bounds.top,
      x2: bounds.left, y2: bounds.top + bounds.height,
      class: "axis-line"
    }, axes);

    const xLabel = el("text", {
      x: bounds.left + bounds.width / 2, y: 577,
      "text-anchor": "middle", class: "axis-label"
    }, axes);
    xLabel.textContent = "Minor axis";

    const yLabel = el("text", {
      x: 19, y: bounds.top + bounds.height / 2,
      "text-anchor": "middle", class: "axis-label",
      transform: `rotate(-90 19 ${bounds.top + bounds.height / 2})`
    }, axes);
    yLabel.textContent = "Height";
  }

  function pcaSegment(center, vector) {
    const margins = 2;
    const candidates = [];

    if (Math.abs(vector.x) > 1e-10) {
      candidates.push((domain.xMin + margins - center.x) / vector.x);
      candidates.push((domain.xMax - margins - center.x) / vector.x);
    }
    if (Math.abs(vector.y) > 1e-10) {
      candidates.push((domain.yMin + margins - center.y) / vector.y);
      candidates.push((domain.yMax - margins - center.y) / vector.y);
    }

    const valid = candidates.filter(t => {
      const x = center.x + t * vector.x;
      const y = center.y + t * vector.y;
      return x >= domain.xMin + margins - 0.01 &&
             x <= domain.xMax - margins + 0.01 &&
             y >= domain.yMin + margins - 0.01 &&
             y <= domain.yMax - margins + 0.01;
    }).sort((a, b) => a - b);

    return {
      start: {
        x: center.x + valid[0] * vector.x,
        y: center.y + valid[0] * vector.y
      },
      end: {
        x: center.x + valid[valid.length - 1] * vector.x,
        y: center.y + valid[valid.length - 1] * vector.y
      }
    };
  }

  function renderPCA() {
    const layer = document.getElementById("pcaLayer");
    const labels = document.getElementById("pcaLabels");
    layer.replaceChildren();
    labels.replaceChildren();

    const allPoints = groups.flat();
    const pca = calculatePCA(allPoints);

    pca.vectors.forEach((vector, i) => {
      const segment = pcaSegment(pca.center, vector);
      const color = i === 0 ? "#6554c0" : "#d58a00";

      el("line", {
        x1: sx(segment.start.x), y1: sy(segment.start.y),
        x2: sx(segment.end.x), y2: sy(segment.end.y),
        class: "pc-line",
        stroke: color,
        "stroke-dasharray": i === 1 ? "9 7" : "none",
        "marker-start": `url(#arrow-pc${i + 1})`,
        "marker-end": `url(#arrow-pc${i + 1})`,
        opacity: "0.91"
      }, layer);

      let labelX = sx(segment.end.x);
      let labelY = sy(segment.end.y);
      const insideRight = labelX > bounds.left + bounds.width - 42;
      const insideTop = labelY < bounds.top + 22;

      const label = el("text", {
        x: labelX + (insideRight ? -10 : 10),
        y: labelY + (insideTop ? 18 : -9),
        "text-anchor": insideRight ? "end" : "start",
        class: "pc-label",
        fill: color
      }, labels);
      label.textContent = `PC${i + 1}`;
    });

    el("circle", {
      cx: sx(pca.center.x), cy: sy(pca.center.y), r: 5,
      class: "all-centroid"
    }, layer);

    document.getElementById("variance").textContent =
      `${(pca.explained * 100).toFixed(1)}%`;
  }

  function beginDrag(event, groupIndex) {
    event.preventDefault();
    svg.setPointerCapture(event.pointerId);
    const p = pointerData(event);
    drag = {
      groupIndex,
      pointerId: event.pointerId,
      start: p,
      original: groups[groupIndex].map(point => ({ ...point }))
    };
  }

  function pointerData(event) {
    const pt = svg.createSVGPoint();
    pt.x = event.clientX;
    pt.y = event.clientY;
    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: ix(transformed.x), y: iy(transformed.y) };
  }

  function renderGroups() {
    const pointsLayer = document.getElementById("pointsLayer");
    const centroidLayer = document.getElementById("centroidsLayer");
    pointsLayer.replaceChildren();
    centroidLayer.replaceChildren();

    groups.forEach((points, groupIndex) => {
      points.forEach((point, pointIndex) => {
        const circle = el("circle", {
          cx: sx(point.x), cy: sy(point.y), r: 5.1,
          fill: colors[groupIndex], class: "point",
          tabindex: "0",
          "aria-label": `Group ${groupIndex + 1}, point ${pointIndex + 1}`
        }, pointsLayer);

        const title = el("title", {}, circle);
        title.textContent =
          `Group ${groupIndex + 1}: (${point.x.toFixed(1)}, ${point.y.toFixed(1)})`;
        circle.addEventListener("pointerdown", e => beginDrag(e, groupIndex));
      });

      const c = centroid(points);
      const centroidGroup = el("g", {
        class: "centroid",
        tabindex: "0",
        "aria-label": `Drag Group ${groupIndex + 1} centroid`
      }, centroidLayer);

      el("circle", {
        cx: sx(c.x), cy: sy(c.y), r: 10,
        fill: "white", stroke: colors[groupIndex]
      }, centroidGroup);
      el("line", {
        x1: sx(c.x) - 6, y1: sy(c.y),
        x2: sx(c.x) + 6, y2: sy(c.y),
        stroke: colors[groupIndex], class: "centroid-cross"
      }, centroidGroup);
      el("line", {
        x1: sx(c.x), y1: sy(c.y) - 6,
        x2: sx(c.x), y2: sy(c.y) + 6,
        stroke: colors[groupIndex], class: "centroid-cross"
      }, centroidGroup);

      centroidGroup.addEventListener("pointerdown", e => beginDrag(e, groupIndex));
      document.getElementById(`centroid${groupIndex}`).textContent =
        `(${c.x.toFixed(1)}, ${c.y.toFixed(1)})`;
    });

    const r0 = correlation(groups[0]);
    const r1 = correlation(groups[1]);
    document.getElementById("correlations").textContent =
      `${r0.toFixed(2)} / ${r1.toFixed(2)}`;
  }

  function render() {
    renderPCA();
    renderGroups();
  }

  svg.addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.pointerId) return;

    const current = pointerData(event);
    let dx = current.x - drag.start.x;
    let dy = current.y - drag.start.y;

    const minX = Math.min(...drag.original.map(p => p.x));
    const maxX = Math.max(...drag.original.map(p => p.x));
    const minY = Math.min(...drag.original.map(p => p.y));
    const maxY = Math.max(...drag.original.map(p => p.y));

    dx = Math.max(domain.xMin - minX, Math.min(domain.xMax - maxX, dx));
    dy = Math.max(domain.yMin - minY, Math.min(domain.yMax - maxY, dy));

    groups[drag.groupIndex] = drag.original.map(p => ({
      x: p.x + dx,
      y: p.y + dy
    }));

    render();
  });

  function finishDrag(event) {
    if (drag && event.pointerId === drag.pointerId) {
      drag = null;
      if (svg.hasPointerCapture(event.pointerId)) {
        svg.releasePointerCapture(event.pointerId);
      }
    }
  }

  svg.addEventListener("pointerup", finishDrag);
  svg.addEventListener("pointercancel", finishDrag);
  document.getElementById("reset").addEventListener("click", initialize);

  buildScaffold();
  initialize();
})();
</script>
</body>
</html>
