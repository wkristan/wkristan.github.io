<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Linear Discriminant Axis</title>
<style>
  :root {
    --ink: #18212b;
    --muted: #637083;
    --grid: #dde3ea;
    --panel: #ffffff;
    --page: #f3f6f9;
    --lda: #1769aa;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 22px;
    background: var(--page);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  .app {
    width: min(1100px, 100%);
    margin: auto;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0 0 5px;
    font-size: clamp(1.35rem, 3vw, 2rem);
    letter-spacing: -0.025em;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.94rem;
  }

  button {
    border: 1px solid #c8d0da;
    border-radius: 9px;
    padding: 9px 15px;
    background: white;
    color: var(--ink);
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 1px 2px #1a26331a;
  }

  button:hover { background: #f7f8fa; }

  button:focus-visible {
    outline: 3px solid #7aa7ff88;
    outline-offset: 2px;
  }

  .card {
    overflow: hidden;
    border: 1px solid #d8dee6;
    border-radius: 15px;
    background: var(--panel);
    box-shadow: 0 8px 28px #21304412;
  }

  .plot-wrap {
    position: relative;
    padding: 10px 12px 2px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    min-height: 430px;
    touch-action: none;
    user-select: none;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1;
  }

  .axis-line {
    stroke: #738092;
    stroke-width: 1.4;
  }

  .tick-label {
    fill: #697587;
    font-size: 12px;
  }

  .axis-label {
    fill: #273444;
    font-size: 15px;
    font-weight: 700;
  }

  .point {
    stroke: white;
    stroke-width: 1.25;
    cursor: grab;
    transition: r 100ms ease, filter 100ms ease;
  }

  .point:hover {
    r: 6.2;
    filter: drop-shadow(0 2px 2px #0004);
  }

  .point:active,
  .centroid:active {
    cursor: grabbing;
  }

  .centroid {
    cursor: grab;
    stroke-width: 2.2;
    filter: drop-shadow(0 1px 1px white);
  }

  .centroid-cross {
    pointer-events: none;
    stroke-width: 2.4;
    stroke-linecap: round;
  }

  .lda-overlay {
    pointer-events: none;
  }

  .lda-line {
    stroke: var(--lda);
    stroke-width: 3.4;
    stroke-linecap: round;
  }

  .centroid-connection {
    stroke: var(--lda);
    stroke-width: 8;
    opacity: 0.13;
    stroke-linecap: round;
  }

  .lda-label {
    fill: var(--lda);
    font-size: 13px;
    font-weight: 800;
    paint-order: stroke;
    stroke: white;
    stroke-width: 4px;
    stroke-linejoin: round;
  }

  .status {
    display: grid;
    grid-template-columns: repeat(4, minmax(130px, 1fr));
    border-top: 1px solid #e0e5eb;
    background: #fbfcfd;
  }

  .stat {
    padding: 13px 16px;
    border-right: 1px solid #e0e5eb;
  }

  .stat:last-child { border-right: 0; }

  .stat-name {
    margin-bottom: 3px;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 750;
    letter-spacing: 0.055em;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 1rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    align-items: center;
    padding: 13px 17px;
    border-top: 1px solid #e0e5eb;
    color: #485568;
    font-size: 0.83rem;
  }

  .key {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: black;
  }

  .dot.red { background: #d82828; }

  .line-key {
    width: 25px;
    height: 0;
    border-top: 3px solid var(--lda);
  }

  .hint {
    margin-left: auto;
    color: #536174;
    font-weight: 600;
  }

  @media (max-width: 700px) {
    body { padding: 10px; }
    header { align-items: stretch; }
    .status { grid-template-columns: 1fr 1fr; }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid #e0e5eb; }
    .hint { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Interactive Linear Discriminant Axis</h1>
      <p class="subtitle">
        The discriminant axis follows the line connecting the two group centroids.
      </p>
    </div>
    <button id="reset" type="button">Reset groups</button>
  </header>

  <section class="card">
    <div class="plot-wrap">
      <svg id="plot" viewBox="0 0 960 590" role="img"
           aria-label="Scatterplot with draggable black and red groups, their centroids, and a linear discriminant axis">
        <defs>
          <marker id="lda-arrow" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"></path>
          </marker>

          <clipPath id="plot-clip">
            <rect x="76" y="24" width="856" height="500"></rect>
          </clipPath>
        </defs>

        <g id="grid"></g>
        <g id="axes"></g>

        <g clip-path="url(#plot-clip)">
          <g id="ldaLayer" class="lda-overlay"></g>
          <g id="pointsLayer"></g>
          <g id="centroidsLayer"></g>
        </g>

        <g id="ldaLabels" class="lda-overlay"></g>
      </svg>
    </div>

    <div class="status">
      <div class="stat">
        <div class="stat-name">Black centroid</div>
        <div class="stat-value" id="centroid0">—</div>
      </div>

      <div class="stat">
        <div class="stat-name">Red centroid</div>
        <div class="stat-value" id="centroid1">—</div>
      </div>

      <div class="stat">
        <div class="stat-name">Within-group r</div>
        <div class="stat-value" id="correlations">—</div>
      </div>

      <div class="stat">
        <div class="stat-name">Centroid separation</div>
        <div class="stat-value" id="separation">—</div>
      </div>
    </div>

    <div class="legend">
      <span class="key"><span class="dot"></span>Group 1</span>
      <span class="key"><span class="dot red"></span>Group 2</span>
      <span class="key"><span class="line-key"></span>Discriminant axis</span>
      <span class="hint">Drag any dot or centroid to move its entire group.</span>
    </div>
  </section>
</main>

<script>
(() => {
  const svg = document.getElementById("plot");
  const NS = "http://www.w3.org/2000/svg";

  const bounds = {
    left: 76,
    top: 24,
    width: 856,
    height: 500
  };

  const domain = {
    xMin: 0,
    xMax: 100,
    yMin: 0,
    yMax: 100
  };

  const colors = ["#111111", "#d82828"];
  const initialCenters = [
    { x: 31, y: 34 },
    { x: 69, y: 66 }
  ];

  let groups = [];
  let drag = null;

  const sx = x =>
    bounds.left +
    ((x - domain.xMin) / (domain.xMax - domain.xMin)) * bounds.width;

  const sy = y =>
    bounds.top +
    bounds.height -
    ((y - domain.yMin) / (domain.yMax - domain.yMin)) * bounds.height;

  const ix = px =>
    domain.xMin +
    ((px - bounds.left) / bounds.width) * (domain.xMax - domain.xMin);

  const iy = py =>
    domain.yMin +
    ((bounds.top + bounds.height - py) / bounds.height) *
      (domain.yMax - domain.yMin);

  function el(name, attributes = {}, parent) {
    const node = document.createElementNS(NS, name);

    for (const [key, value] of Object.entries(attributes)) {
      node.setAttribute(key, value);
    }

    if (parent) parent.appendChild(node);
    return node;
  }

  function mean(values) {
    return values.reduce((sum, value) => sum + value, 0) / values.length;
  }

  function centroid(points) {
    return {
      x: mean(points.map(point => point.x)),
      y: mean(points.map(point => point.y))
    };
  }

  /*
    Construct two centered, orthogonal vectors and combine them as
    y = 0.8u + 0.6v. This produces an exact within-group correlation of 0.8.
  */
  function makeCorrelatedPoints(center, phase) {
    const count = 24;

    let u = Array.from(
      { length: count },
      (_, index) => index - (count - 1) / 2
    );

    let v = Array.from(
      { length: count },
      (_, index) =>
        Math.sin((index + 1) * 2.17 + phase) +
        0.45 * Math.cos((index + 1) * 0.91 + phase)
    );

    function centerVector(values) {
      const average = mean(values);
      return values.map(value => value - average);
    }

    u = centerVector(u);
    v = centerVector(v);

    const projection =
      u.reduce((sum, value, index) => sum + value * v[index], 0) /
      u.reduce((sum, value) => sum + value * value, 0);

    v = v.map((value, index) => value - projection * u[index]);

    const normU = Math.sqrt(mean(u.map(value => value * value)));
    const normV = Math.sqrt(mean(v.map(value => value * value)));

    u = u.map(value => value / normU);
    v = v.map(value => value / normV);

    return u.map((value, index) => ({
      x: center.x + 8.5 * value,
      y: center.y + 8.5 * (0.8 * value + 0.6 * v[index])
    }));
  }

  function correlation(points) {
    const center = centroid(points);
    let xx = 0;
    let yy = 0;
    let xy = 0;

    for (const point of points) {
      const dx = point.x - center.x;
      const dy = point.y - center.y;
      xx += dx * dx;
      yy += dy * dy;
      xy += dx * dy;
    }

    return xy / Math.sqrt(xx * yy);
  }

  function buildScaffold() {
    const grid = document.getElementById("grid");
    const axes = document.getElementById("axes");

    for (let tick = 0; tick <= 100; tick += 10) {
      el("line", {
        x1: sx(tick),
        y1: bounds.top,
        x2: sx(tick),
        y2: bounds.top + bounds.height,
        class: "grid-line"
      }, grid);

      el("line", {
        x1: bounds.left,
        y1: sy(tick),
        x2: bounds.left + bounds.width,
        y2: sy(tick),
        class: "grid-line"
      }, grid);

      if (tick % 20 === 0) {
        const xTick = el("text", {
          x: sx(tick),
          y: bounds.top + bounds.height + 22,
          "text-anchor": "middle",
          class: "tick-label"
        }, axes);
        xTick.textContent = tick;

        const yTick = el("text", {
          x: bounds.left - 12,
          y: sy(tick) + 4,
          "text-anchor": "end",
          class: "tick-label"
        }, axes);
        yTick.textContent = tick;
      }
    }

    el("line", {
      x1: bounds.left,
      y1: bounds.top + bounds.height,
      x2: bounds.left + bounds.width,
      y2: bounds.top + bounds.height,
      class: "axis-line"
    }, axes);

    el("line", {
      x1: bounds.left,
      y1: bounds.top,
      x2: bounds.left,
      y2: bounds.top + bounds.height,
      class: "axis-line"
    }, axes);

    const xLabel = el("text", {
      x: bounds.left + bounds.width / 2,
      y: 577,
      "text-anchor": "middle",
      class: "axis-label"
    }, axes);
    xLabel.textContent = "Minor axis";

    const yLabel = el("text", {
      x: 19,
      y: bounds.top + bounds.height / 2,
      "text-anchor": "middle",
      class: "axis-label",
      transform: `rotate(-90 19 ${bounds.top + bounds.height / 2})`
    }, axes);
    yLabel.textContent = "Height";
  }

  /*
    Extend the centroid-to-centroid line until it intersects the plot boundaries.
  */
  function extendedAxis(center1, center2) {
    let vx = center2.x - center1.x;
    let vy = center2.y - center1.y;
    const magnitude = Math.hypot(vx, vy);

    if (magnitude < 0.0001) {
      vx = 1;
      vy = 0;
    } else {
      vx /= magnitude;
      vy /= magnitude;
    }

    const midpoint = {
      x: (center1.x + center2.x) / 2,
      y: (center1.y + center2.y) / 2
    };

    const margin = 2;
    const candidates = [];

    if (Math.abs(vx) > 1e-10) {
      candidates.push((domain.xMin + margin - midpoint.x) / vx);
      candidates.push((domain.xMax - margin - midpoint.x) / vx);
    }

    if (Math.abs(vy) > 1e-10) {
      candidates.push((domain.yMin + margin - midpoint.y) / vy);
      candidates.push((domain.yMax - margin - midpoint.y) / vy);
    }

    const valid = candidates
      .filter(parameter => {
        const x = midpoint.x + parameter * vx;
        const y = midpoint.y + parameter * vy;

        return (
          x >= domain.xMin + margin - 0.01 &&
          x <= domain.xMax - margin + 0.01 &&
          y >= domain.yMin + margin - 0.01 &&
          y <= domain.yMax - margin + 0.01
        );
      })
      .sort((a, b) => a - b);

    return {
      start: {
        x: midpoint.x + valid[0] * vx,
        y: midpoint.y + valid[0] * vy
      },
      end: {
        x: midpoint.x + valid[valid.length - 1] * vx,
        y: midpoint.y + valid[valid.length - 1] * vy
      }
    };
  }

  function renderDiscriminantAxis() {
    const layer = document.getElementById("ldaLayer");
    const labels = document.getElementById("ldaLabels");
    layer.replaceChildren();
    labels.replaceChildren();

    const center1 = centroid(groups[0]);
    const center2 = centroid(groups[1]);
    const axis = extendedAxis(center1, center2);

    el("line", {
      x1: sx(center1.x),
      y1: sy(center1.y),
      x2: sx(center2.x),
      y2: sy(center2.y),
      class: "centroid-connection"
    }, layer);

    el("line", {
      x1: sx(axis.start.x),
      y1: sy(axis.start.y),
      x2: sx(axis.end.x),
      y2: sy(axis.end.y),
      class: "lda-line",
      "marker-start": "url(#lda-arrow)",
      "marker-end": "url(#lda-arrow)"
    }, layer);

    const endX = sx(axis.end.x);
    const endY = sy(axis.end.y);
    const nearRight = endX > bounds.left + bounds.width - 120;
    const nearTop = endY < bounds.top + 24;

    const label = el("text", {
      x: endX + (nearRight ? -12 : 12),
      y: endY + (nearTop ? 19 : -10),
      "text-anchor": nearRight ? "end" : "start",
      class: "lda-label"
    }, labels);
    label.textContent = "Discriminant axis";

    const separation = Math.hypot(
      center2.x - center1.x,
      center2.y - center1.y
    );

    document.getElementById("separation").textContent =
      separation.toFixed(1);
  }

  function pointerData(event) {
    const point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;

    const transformed = point.matrixTransform(
      svg.getScreenCTM().inverse()
    );

    return {
      x: ix(transformed.x),
      y: iy(transformed.y)
    };
  }

  function beginDrag(event, groupIndex) {
    event.preventDefault();
    svg.setPointerCapture(event.pointerId);

    drag = {
      groupIndex,
      pointerId: event.pointerId,
      start: pointerData(event),
      original: groups[groupIndex].map(point => ({ ...point }))
    };
  }

  function renderGroups() {
    const pointsLayer = document.getElementById("pointsLayer");
    const centroidLayer = document.getElementById("centroidsLayer");
    pointsLayer.replaceChildren();
    centroidLayer.replaceChildren();

    groups.forEach((points, groupIndex) => {
      points.forEach((point, pointIndex) => {
        const circle = el("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: 5.1,
          fill: colors[groupIndex],
          class: "point",
          tabindex: "0",
          "aria-label": `Group ${groupIndex + 1}, point ${pointIndex + 1}`
        }, pointsLayer);

        const title = el("title", {}, circle);
        title.textContent =
          `Group ${groupIndex + 1}: ` +
          `(${point.x.toFixed(1)}, ${point.y.toFixed(1)})`;

        circle.addEventListener(
          "pointerdown",
          event => beginDrag(event, groupIndex)
        );
      });

      const center = centroid(points);
      const centroidGroup = el("g", {
        class: "centroid",
        tabindex: "0",
        "aria-label": `Drag Group ${groupIndex + 1} centroid`
      }, centroidLayer);

      el("circle", {
        cx: sx(center.x),
        cy: sy(center.y),
        r: 10,
        fill: "white",
        stroke: colors[groupIndex]
      }, centroidGroup);

      el("line", {
        x1: sx(center.x) - 6,
        y1: sy(center.y),
        x2: sx(center.x) + 6,
        y2: sy(center.y),
        stroke: colors[groupIndex],
        class: "centroid-cross"
      }, centroidGroup);

      el("line", {
        x1: sx(center.x),
        y1: sy(center.y) - 6,
        x2: sx(center.x),
        y2: sy(center.y) + 6,
        stroke: colors[groupIndex],
        class: "centroid-cross"
      }, centroidGroup);

      centroidGroup.addEventListener(
        "pointerdown",
        event => beginDrag(event, groupIndex)
      );

      document.getElementById(`centroid${groupIndex}`).textContent =
        `(${center.x.toFixed(1)}, ${center.y.toFixed(1)})`;
    });

    const r1 = correlation(groups[0]);
    const r2 = correlation(groups[1]);

    document.getElementById("correlations").textContent =
      `${r1.toFixed(2)} / ${r2.toFixed(2)}`;
  }

  function render() {
    renderDiscriminantAxis();
    renderGroups();
  }

  function initialize() {
    groups = [
      makeCorrelatedPoints(initialCenters[0], 0.25),
      makeCorrelatedPoints(initialCenters[1], 1.4)
    ];

    render();
  }

  svg.addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.pointerId) return;

    const current = pointerData(event);
    let dx = current.x - drag.start.x;
    let dy = current.y - drag.start.y;

    const minX = Math.min(...drag.original.map(point => point.x));
    const maxX = Math.max(...drag.original.map(point => point.x));
    const minY = Math.min(...drag.original.map(point => point.y));
    const maxY = Math.max(...drag.original.map(point => point.y));

    dx = Math.max(
      domain.xMin - minX,
      Math.min(domain.xMax - maxX, dx)
    );

    dy = Math.max(
      domain.yMin - minY,
      Math.min(domain.yMax - maxY, dy)
    );

    groups[drag.groupIndex] = drag.original.map(point => ({
      x: point.x + dx,
      y: point.y + dy
    }));

    render();
  });

  function finishDrag(event) {
    if (!drag || event.pointerId !== drag.pointerId) return;

    drag = null;

    if (svg.hasPointerCapture(event.pointerId)) {
      svg.releasePointerCapture(event.pointerId);
    }
  }

  svg.addEventListener("pointerup", finishDrag);
  svg.addEventListener("pointercancel", finishDrag);
  document.getElementById("reset").addEventListener("click", initialize);

  buildScaffold();
  initialize();
})();
</script>
</body>
</html>
